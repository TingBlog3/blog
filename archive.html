<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive · Blog Name</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js"></script>
</head>
<body>
  <header class="banner">
    <h1><a href="index.html">Blog Name</a></h1>
  </header>

  <nav class="tabs">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="archive.html" aria-current="page">Archive</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode">☾</button>
  </nav>

  <main class="content archive">
    <h2>Archive</h2>

    <!-- Filled automatically from the posts' data-tags -->
    <div class="tags all-tags"></div>

    <p class="tag-filter" hidden>
      Showing posts tagged <strong class="tag-name"></strong> · <a href="archive.html">show all</a>
    </p>

    <!--
      One <section class="year"> per year, newest first.
      Each post: <li data-tags="tag1, tag2"> — the tag chips and the filter use these.
    -->
    <section class="year">
      <h3>2026</h3>
      <ul>
        <li data-tags="embedded, notes">
          <time datetime="2026-10-01">Oct 01</time>
          <div class="entry">
            <a href="posts/2026-10-01-first-post.html">First Post</a>
            <div class="meta">by <a href="about.html#author-1">Author One</a></div>
            <div class="tags">
              <a class="tag" href="archive.html?tag=embedded">embedded</a>
              <a class="tag" href="archive.html?tag=notes">notes</a>
            </div>
          </div>
        </li>
        <li data-tags="controls">
          <time datetime="2026-09-20">Sep 20</time>
          <div class="entry">
            <a href="#">Second Example Post</a>
            <div class="meta">by <a href="about.html#author-2">Author Two</a></div>
            <div class="tags">
              <a class="tag" href="archive.html?tag=controls">controls</a>
            </div>
          </div>
        </li>
      </ul>
    </section>
  </main>

  <footer>© 2026 Blog Name</footer>
</body>
</html>
